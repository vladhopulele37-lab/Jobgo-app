<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOBGO - Find your future</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-[#102b52] text-white p-6">
<h1 class="text-3xl font-black">JOBGO<span class="text-[#55b6ff]">.</span></h1>
<p>Find your future - simple and fast</p>
</header>
<div class="p-6 max-w-3xl mx-auto">
<h2 class="text-4xl font-bold mt-10 text-center">Găsește jobul<br><span class="text-blue-600">perfect</span> azi</h2>
<div class="bg-white mt-8 p-2 rounded-full shadow-lg flex">
<input class="flex-1 px-6 py-3 outline-none rounded-full" placeholder="Ce job cauți?">
<button class="bg-[#102b52] text-white px-8 py-3 rounded-full">Caută</button>
</div>
<div class="grid gap-4 mt-10">
<div class="bg-white p-5 rounded-2xl border"><b>Frontend Developer</b> - Remote - $4.5k</div>
<div class="bg-white p-5 rounded-2xl border"><b>Junior UX Designer</b> - Brussels - $2k</div>
<div class="bg-white p-5 rounded-2xl border"><b>Backend Intern</b> - Leuven - $1.2k</div>
</div>
</div>
</body>
</html>
